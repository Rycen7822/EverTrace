[workspace]
members = [
    "crates/evertrace-domain",
    "crates/evertrace-capture",
    "crates/evertrace-store",
    "crates/evertrace-codex",
    "crates/evertrace-engine",
    "crates/evertrace-protocol",
    "crates/evertrace-tui",
    "crates/evertrace-hook",
    "crates/evertraced",
    "crates/evertrace-cli",
    "crates/evertrace-testkit",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97.1"
version = "0.0.0"

[workspace.dependencies]
arrow-array = "=58.3.0"
arrow-schema = "=58.3.0"
crossterm = "=0.28.1"
fs2 = "=0.4.3"
hmac = "=0.12.1"
lancedb = { version = "=0.37.1", default-features = false }
ratatui = { version = "=0.29.0", default-features = false, features = ["crossterm"] }
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "rustls-tls"] }
rustix = { version = "=1.1.4", features = ["fs"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
tempfile = "=3.23.0"
thiserror = "=2.0.18"
tokio = { version = "=1.52.0", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "=0.9.8"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter", "fmt"] }
url = "=2.5.8"
uuid = { version = "=1.23.0", features = ["serde", "v7"] }
zstd = "=0.13.3"

[workspace.lints.rust]
warnings = "deny"
