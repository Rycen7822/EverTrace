# Local first-run configuration / 首次本地试用配置。
# No background model calls until llm.enabled is explicitly changed.
# 在明确启用 llm.enabled 前，不调用后台模型。
config_version = 1

[runtime]
data_dir = "~/.local/share/evertrace-trial"

[llm]
enabled = false
# When enabling, choose openai_compatible, openai_responses or anthropic; see ../configuration.md.
# 启用时按配置指南选择协议，填写 API 根地址、模型和密钥环境变量；不要填完整接口路径。
