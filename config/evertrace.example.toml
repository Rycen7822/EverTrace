config_version = 1

[runtime]
data_dir = "~/.local/share/evertrace"
log_level = "info"
background_workers = 2

[dreaming]
idle_enabled = true
idle_after = "30m"
integrity_sweep_interval = "24h"
max_llm_tasks_per_run = 4
max_wall_time = "10m"

[procedure]
auto_publish_full = true
include_probationary = true
stable_min_outcome_supported = 3

[global_promotion]
atom = "semi_auto"
procedure = "semi_auto"
core_membership = "manual"

[search]
search_token_budget = 600
get_token_budget = 1200

[session_import]
historical_metadata_backfill = true
max_concurrent_body_imports = 1
max_body_import_mib_per_run = 256

[capture]
preview_bytes = 8192
inline_payload_bytes = 32768

[recovery]
capture_timeout = "10s"
max_bundle_mib = 256
max_untracked_file_mib = 16
max_untracked_total_mib = 128

[llm]
enabled = true
# Protocol / 协议: openai_compatible -> /chat/completions;
# openai_responses -> /responses; anthropic -> /messages. No automatic fallback / 无自动回退。
provider = "openai_compatible"
# API root only / 填 API 根地址，不含上述接口后缀。
# OpenAI: https://api.openai.com/v1; Anthropic: https://api.anthropic.com/v1.
# Responses uses store=false; Messages requests plain JSON, validated locally.
# Responses 不存远程会话；Messages 提示纯 JSON 并由本地严格校验，不开扩展思考。
base_url = "https://provider.example/v1"
model = "provider-model-name"
api_key_env = "EVERTRACE_LLM_API_KEY"
# Same env variable for every protocol; Messages uses x-api-key, others Bearer.
# 三种协议均从该环境变量读取密钥，不要把密钥写进 TOML 或 URL。
timeout = "90s"
max_concurrency = 1
episode_enrichment = "adaptive"
max_episode_enrichments = 2
daily_input_token_budget = 500000
daily_output_token_budget = 100000
daily_call_budget = 200
daily_wall_time_budget = "2h"
unlimited_token_budget = false
