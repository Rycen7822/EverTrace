{% for item in items %}
<button class="memory-item" data-key="{{ item.stable_key }}" data-revision="{{ item.revision_ref or '' }}">
  <div class="item-topline"><span class="type-pill">{{ item.object_kind }}</span>{% if item.epistemic %}<span class="badge">{{ item.epistemic }}</span>{% endif %}</div>
  <h3>{{ item.object_kind }} · {{ (item.revision_ref or item.object_ref or item.stable_key)[:12] }}</h3>
  <p>{{ item.scope_ref or '范围未提供；正文权限在展开时验证' }}</p>
</button>
{% else %}<div class="empty">当前没有记忆记录。</div>{% endfor %}
