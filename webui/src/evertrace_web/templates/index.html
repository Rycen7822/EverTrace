<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>记忆 · EverTrace</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M12 7h14M12 16h9M12 25h14' stroke='%23d15010' stroke-width='2'/%3E%3Ccircle cx='6' cy='7' r='3' fill='%23d15010'/%3E%3Ccircle cx='6' cy='16' r='3' fill='%23d15010'/%3E%3Ccircle cx='6' cy='25' r='3' fill='%23d15010'/%3E%3C/svg%3E">
  <link rel="preload" href="/assets/fonts/IBMPlexSans-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<a class="skip-link" href="#main-content">跳至主要内容</a>
<aside class="sidebar" aria-label="主导航">
  <a class="brand" href="#memories" aria-label="EverTrace 记忆"><svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M12 7h14M12 16h9M12 25h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="6" cy="7" r="3" fill="currentColor"/><circle cx="6" cy="16" r="3" fill="currentColor"/><circle cx="6" cy="25" r="3" fill="currentColor"/></svg><span class="brand-copy">EverTrace<small>记忆与证据</small></span></a>
  <div class="workspace"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="m12 2 10 5-10 5L2 7l10-5ZM2 12l10 5 10-5M2 17l10 5 10-5"/></svg><span><span class="workspace-name">本地工作区</span><small>全部可读记忆</small></span></div>
  <nav>
    <div class="nav-section"><div class="nav-title">工作空间</div>
      <button class="nav-item" data-route="overview"><span>最近</span></button>
      <button class="nav-item active" data-route="memories" aria-current="page"><span>记忆</span></button>
      <button class="nav-item" data-route="work"><span>工作</span></button>
      <button class="nav-item" data-route="research"><span>研究</span></button>
    </div>
    <div class="nav-section"><div class="nav-title">证据与管理</div>
      <button class="nav-item" data-route="sources"><span>来源</span></button>
      <button class="nav-item" data-route="review"><span>审核</span></button>
      <button class="nav-item" data-route="system"><span>系统</span></button>
    </div>
  </nav>
  <div class="sidebar-bottom"><div class="local-card"><div class="local-title"><span id="status-dot" class="status-dot gray"></span><span id="connection-status">等待认证</span></div><p>仅连接本机 daemon<br>当前为只读接入</p><button id="logout" class="text-button">结束网页会话</button></div><div class="profile"><span class="avatar">ET</span><span class="profile-text">个人工作区<small>内容不存入浏览器缓存</small></span></div></div>
</aside>
<div id="frame" class="app-main route-memories">
  <header class="topbar"><div class="breadcrumb"><span>本地工作区</span><span>›</span><strong id="breadcrumb">记忆</strong></div><button class="top-search" disabled title="搜索尚未接入"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><span>搜索记忆、来源和工作（未接入）</span></button><div class="top-actions"><span class="mode-label">本机连接 · 只读</span></div></header>
  <main id="main-content" class="main-content" tabindex="-1">
    <div class="page-heading"><div><h1 id="page-title">记忆</h1><p id="page-description">查看 daemon 中当前可读的记忆。暂未开放网页修改。</p></div><div class="page-actions"><button id="refresh" class="button">刷新</button></div></div>
    <div id="notice" class="notice" role="status">正在验证本机网页会话…</div>
    <section id="reader" class="browser" aria-label="记忆阅读器" hidden>
      <div class="browser-list"><div class="browser-list-head"><div class="toolbar"><strong>记忆记录</strong><span class="muted">只读</span></div><div class="tabs"><span class="tab active">当前条目<span id="page-count" class="tab-count">正在读取</span></span></div><div class="browse-filters"><select id="reading-kind" aria-label="阅读种类"><option value="all">全部种类</option><option value="summaries">摘要</option><option value="facts_and_constraints">事实与约束</option><option value="methods">正式方法</option><option value="references">提案参考</option></select><select id="browse-order" aria-label="录入顺序"><option value="recorded_newest">后录入在前</option><option value="recorded_oldest">先录入在前</option></select><select id="epistemic-filter" aria-label="Atom 真值状态"><option value="">全部真值状态</option><option value="not_applicable">不适用</option><option value="unverified">未验证</option><option value="supported">有支持</option><option value="disputed">有争议</option><option value="refuted">已反驳</option></select><select id="authority-filter" aria-label="Atom 权威来源"><option value="">全部权威来源</option><option value="user_explicit">用户明确授权</option><option value="project_policy">项目策略</option><option value="objective_evidence">客观证据</option><option value="agent_inferred">Agent 推断</option><option value="imported_claim">导入声明</option></select><select id="lifecycle-filter" aria-label="Atom 生命周期"><option value="">全部 Atom 生命周期</option><option value="active">活跃</option><option value="superseded">已被替代</option><option value="deprecated">已弃用</option></select></div></div><div id="memory-items" class="memory-items"></div><div class="list-footer"><button id="first-page" class="text-button">返回首页</button><button id="next-page" class="text-button" disabled>下一页</button></div></div>
      <article class="memory-detail"><div class="detail-toolbar"><span id="detail-ref" class="detail-ref"></span><div id="detail-actions" class="detail-actions"></div></div><div id="detail-body" class="detail-body"><div class="empty"><h3>选择一条记忆</h3><p>正文和修订将从 daemon 读取。</p></div></div></article>
    </section>
    <section id="system-panel" class="panel reading-note" hidden><h2>连接状态</h2><div id="system-status"></div></section>
  </main>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
