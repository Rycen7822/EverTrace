{% for group in groups %}
<section class="catalog-session">
<p class="muted">Session {{ group.session_id }} · 本页 {{ group.entries|length }} 个独立来源；分组只覆盖当前页</p>
{% for item in group.entries %}
<button type="button" class="memory-item source-catalog-item" data-catalog-source="{{ item.source_instance_id }}">
  <div class="item-top">
    <span class="type-pill">已登记来源</span><span class="muted">{{ item.body_label }}</span>
  </div>
  <h3 class="item-title">{{ item.source_instance_id }}</h3>
  <p class="reading-excerpt">{{ item.progress_label }}</p>
  <div class="item-meta">
    <span>历史归属：{{ item.workspace_resolution_kind }}</span><span>目录修订 {{ item.catalog_revision }}</span>
  </div>
</button>
{% endfor %}
</section>
{% else %}
<div class="empty">
  <h3>这些条件下没有已登记来源</h3><p>这不表示宿主没有历史会话，也不表示正文已完成扫描或导入。</p>
</div>
{% endfor %}
